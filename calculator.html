<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div>
        <div class="calculator" style="background: linear-gradient(to bottom, #18022d, #031802);">
            <h1 style="color: rgb(200, 205, 205);">welcom to my Calculator app</h1>
            <div class="input-screen">
                <input type="text" name="input-screen" id="inp-scr" readonly disabled></input>
            </div>
            <div class="main-div">
                <div class="button-grid" >
                    <button style="color:brown;">C</button>
                    <button style="color:brown;">AC</button>
                    <button style="color:rgb(0, 158, 21);">ON</button><br>
                    <button >7</button>
                    <button >8</button>
                    <button >9</button><br> 
                    <button >4</button>
                    <button >5</button>
                    <button >6</button> <br>
                    <button >1</button>
                    <button >2</button>
                    <button >3</button> <br>
                    <button >0</button>
                    <button >.</button>
                    <button >%</button> <br>
                    <button >x</button>
                    <button >/</button>
                    
                    <button >-</button>
                </div>
                <div class="equal">
                    <button style="height: 45.5%; ">+</button><br>
                    <button style="height: 45.5%; ">=</button> 
                </div> 
            </div>    
        </div>
    </div>
    <script src="backend.js"></script>
</body>
</html><!-- PK07HABB0011627900239203 -->
